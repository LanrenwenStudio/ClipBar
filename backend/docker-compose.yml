services:
  clipbar-backend:
    build: .
    container_name: clipbar-backend
    restart: unless-stopped
    environment:
      CLIPROXY_BASE_URL: ${CLIPROXY_BASE_URL:-http://192.168.1.3:8317}
      CLIPROXY_MANAGEMENT_KEY: ${CLIPROXY_MANAGEMENT_KEY:?set CLIProxyAPI management key}
      CLIPBAR_ACCESS_TOKEN: ${CLIPBAR_ACCESS_TOKEN:?set ClipBar backend access token}
      POLL_INTERVAL_SECONDS: ${POLL_INTERVAL_SECONDS:-600}
      DATA_PATH: /data/snapshot.json
      SETTINGS_PATH: /data/settings.json
    ports:
      - "${CLIPBAR_PORT:-8081}:8080"
    volumes:
      - ./data:/data
    network_mode: bridge
