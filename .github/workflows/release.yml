name: Release ClipBar

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate (if configured)
        if: env.HAS_DEV_ID != ''
        env:
          HAS_DEV_ID: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12: ${{ secrets.DEVELOPER_ID_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/developer-id.keychain-db"
          security create-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          security unlock-keychain -p "$RUNNER_TEMP" "$KEYCHAIN"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$RUNNER_TEMP" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN"
          echo "DEVID_KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key (if configured)
        if: env.HAS_ASC_KEY != ''
        env:
          HAS_ASC_KEY: ${{ secrets.ASC_API_KEY_BASE64 }}
          API_KEY: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/asc-key.p8"
          chmod 600 "$RUNNER_TEMP/asc-key.p8"
          echo "NOTARYTOOL_KEY_PATH=$RUNNER_TEMP/asc-key.p8" >> "$GITHUB_ENV"

      - name: Build, package & notarize app
        env:
          NOTARYTOOL_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          NOTARYTOOL_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          DISTRIBUTION_MODE: ${{ secrets.DEVELOPER_ID_P12_BASE64 != '' && 'developer-id' || 'local' }}
        run: |
          ./scripts/package-app.sh

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            dist/*.dmg
            dist/*.zip

      - name: Upload build artifact (on workflow_dispatch or PR)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: ClipBar-Build
          path: dist/

      - name: Update Homebrew cask in homebrew-apps
        if: startsWith(github.ref, 'refs/tags/') && env.TAP_TOKEN != ''
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(shasum -a 256 dist/ClipBar.zip | awk '{print $1}')"
          
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/LanrenwenStudio/homebrew-apps.git" "$RUNNER_TEMP/homebrew-apps"
          cd "$RUNNER_TEMP/homebrew-apps"
          if [ -f "Casks/clipbar.rb" ]; then
            sed -i '' -e "s/version \".*\"/version \"$VERSION\"/" -e "s/sha256 \".*\"/sha256 \"$SHA\"/" Casks/clipbar.rb
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add Casks/clipbar.rb
            git commit -m "chore: update ClipBar cask to $VERSION" || exit 0
            git push
          fi
