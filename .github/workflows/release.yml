name: Release ClipBar

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
    runs-on: macos-15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Select Xcode 16
        run: |
          if [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app
          fi
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build universal app
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/ClipBarDerivedData
        run: |
          xcodegen generate
          xcodebuild \
            -scheme ClipBar \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package app & compute sha256
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/ClipBarDerivedData
          ZIP_PATH: ${{ runner.temp }}/ClipBar.zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$DERIVED_DATA_PATH/Build/Products/Release/ClipBar.app" \
            "$ZIP_PATH"
          shasum -a 256 "$ZIP_PATH" > "${ZIP_PATH}.sha256"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          files: |
            ${{ runner.temp }}/ClipBar.zip
            ${{ runner.temp }}/ClipBar.zip.sha256

      - name: Upload build artifact (on workflow_dispatch or PR)
        uses: actions/upload-artifact@v4
        if: "!startsWith(github.ref, 'refs/tags/')"
        with:
          name: ClipBar-Universal
          path: ${{ runner.temp }}/ClipBar.zip

      - name: Update Homebrew cask in homebrew-apps
        if: startsWith(github.ref, 'refs/tags/') && env.TAP_TOKEN != ''
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA="$(awk '{print $1}' ${{ runner.temp }}/ClipBar.zip.sha256)"
          
          git clone "https://x-access-token:${TAP_TOKEN}@github.com/LanrenwenStudio/homebrew-apps.git" "$RUNNER_TEMP/homebrew-apps"
          cd "$RUNNER_TEMP/homebrew-apps"
          if [ -f "Casks/clipbar.rb" ]; then
            sed -i '' -e "s/version \".*\"/version \"$VERSION\"/" -e "s/sha256 \".*\"/sha256 \"$SHA\"/" Casks/clipbar.rb
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git add Casks/clipbar.rb
            git commit -m "chore: update ClipBar cask to $VERSION" || exit 0
            git push
          fi
