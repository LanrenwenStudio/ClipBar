name: Release ClipBar

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-14

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build universal app
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/ClipBarDerivedData
        run: |
          xcodegen generate
          xcodebuild \
            -scheme ClipBar \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath "$DERIVED_DATA_PATH" \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Package app
        env:
          DERIVED_DATA_PATH: ${{ runner.temp }}/ClipBarDerivedData
          ZIP_PATH: ${{ runner.temp }}/ClipBar.zip
        run: |
          ditto -c -k --sequesterRsrc --keepParent \
            "$DERIVED_DATA_PATH/Build/Products/Release/ClipBar.app" \
            "$ZIP_PATH"

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: ${{ runner.temp }}/ClipBar.zip
